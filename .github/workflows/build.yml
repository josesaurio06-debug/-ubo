name: Build Mod
on:
  workflow_dispatch:
  push:
    branches: ["**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: Android64
          combine: true
  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: out
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: ${{ steps.out.outputs.build-output }}
